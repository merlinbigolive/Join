<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06110b"><title>Merlin Agency — Visitor Admin</title>
<style>
:root{--bg:#020705;--panel:#071b10;--gold:#e4b83d;--gold2:#fff0a1;--text:#f1f8f3;--muted:#8fa197;--line:rgba(255,239,150,.16)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(228,184,61,.09),transparent 30%),var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.login{max-width:650px;margin:8vh auto;padding:34px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(7,28,17,.96),rgba(3,10,7,.98));box-shadow:0 24px 80px rgba(0,0,0,.45)}.brand{display:flex;align-items:center;gap:12px}.mark{width:50px;height:50px;border:1px solid var(--gold);border-radius:13px;display:grid;place-items:center;color:var(--gold);font:34px Georgia}.brand b{display:block;font:22px Georgia;letter-spacing:.12em}.brand small{display:block;color:#75867c;letter-spacing:.2em;margin-top:4px}.login h1{font:58px Georgia;margin:42px 0 18px}.muted{color:var(--muted);font-size:18px;line-height:1.6}.field{margin-top:24px}.field label{display:block;color:#b9c7bf;font-size:13px;font-weight:800;margin-bottom:10px}.field input{width:100%;padding:18px 20px;border-radius:14px;border:1px solid rgba(255,239,150,.18);background:#020705;color:#fff;font-size:18px;outline:none}.primary,.btn{border:0;border-radius:14px;background:linear-gradient(135deg,#f3c744,#dba927);color:#111;font-weight:900;padding:17px 22px;cursor:pointer}.primary{width:100%;margin-top:26px;font-size:17px}.error{display:none;color:#ffb4b4;margin-top:14px}.status{margin-top:16px;color:#fff0a1}.top{padding:22px 0;border-bottom:1px solid var(--line)}.top-inner{display:flex;justify-content:space-between;align-items:center}.logout{border:1px solid rgba(228,184,61,.4);background:transparent;color:#fff0a1;border-radius:10px;padding:10px 15px;font-weight:800}.dashboard{display:none;padding:30px 0 60px}.dashboard.open{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:linear-gradient(145deg,#092317,#04100a);border:1px solid var(--line);border-radius:18px;padding:20px}.stat small{color:var(--muted)}.stat b{display:block;font-size:34px;margin-top:8px}.panel{background:#06130c;border:1px solid var(--line);border-radius:20px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.table-wrap{overflow:auto}.rows{width:100%;border-collapse:collapse;min-width:760px}.rows th,.rows td{text-align:left;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}.rows th{color:#c4d0c9}.tag{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:800}.human{background:rgba(68,190,122,.13);color:#93e4b4}.bot{background:rgba(228,184,61,.13);color:#ffe58a}.empty{padding:28px;color:var(--muted)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.login h1{font-size:46px}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.login{margin:30px auto;padding:24px}.login h1{font-size:40px}.muted{font-size:16px}}
</style></head><body>
<section id="loginView" class="wrap login"><div class="brand"><span class="mark">M</span><span><b>MERLIN</b><small>AGENCY ADMIN</small></span></div><h1>Visitor Admin</h1><div class="muted">Private dashboard for Merlin Agency visitor records.</div><div class="field"><label>ADMIN PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div><button id="loginBtn" class="primary">Login to Admin Panel</button><div id="error" class="error"></div><div id="status" class="status">Supabase ready</div></section>
<section id="dashboard" class="dashboard"><header class="top"><div class="wrap top-inner"><div class="brand"><span class="mark">M</span><span><b>MERLIN</b><small>AGENCY ADMIN</small></span></div><button id="logout" class="logout">Logout</button></div></header><main class="wrap"><div class="panel-head" style="padding-left:0;padding-right:0;border:0"><div><h2 style="font:42px Georgia;margin:22px 0 6px">Visitor Overview</h2><div class="muted">begrow.in · Supabase visitor logs</div></div><div><button class="btn" id="refresh">Refresh</button> <button class="btn" id="reset">Reset Visitors</button></div></div><div class="stats"><div class="stat"><small>TOTAL VISITORS</small><b id="total">0</b></div><div class="stat"><small>HUMAN</small><b id="human">0</b></div><div class="stat"><small>BOTS</small><b id="bots">0</b></div><div class="stat"><small>TODAY</small><b id="today">0</b></div></div><div class="panel"><div class="panel-head"><strong>Recent Visitors</strong><span id="lastStatus" class="muted">Loading…</span></div><div class="table-wrap"><table class="rows"><thead><tr><th>TYPE</th><th>CITY</th><th>COUNTRY</th><th>DATE / TIME</th><th>REFERRER</th></tr></thead><tbody id="visitorRows"></tbody></table></div></div></main></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="visitor-config.js"></script><script>
const CFG=window.MERLIN_SUPABASE; const ADMIN_PASSWORD='Admin@2026!'; let supabase=null;
const $=id=>document.getElementById(id);
function showError(m){$('error').textContent=m;$('error').style.display='block'}
function login(){if($('password').value!==ADMIN_PASSWORD){showError('Incorrect admin password.');return}localStorage.setItem('merlin_admin_auth','1');$('loginView').style.display='none';$('dashboard').classList.add('open');loadVisitors()}
function logout(){localStorage.removeItem('merlin_admin_auth');location.reload()}
async function init(){try{supabase=window.supabase.createClient(CFG.url,CFG.anonKey);$('status').textContent='Supabase connected';if(localStorage.getItem('merlin_admin_auth')==='1'){ $('loginView').style.display='none';$('dashboard').classList.add('open');loadVisitors();}}catch(e){$('status').textContent='Supabase setup error';showError(e.message)}}
async function loadVisitors(){if(!supabase)return;$('lastStatus').textContent='Loading…';const {data,error}=await supabase.from('visitor_logs').select('*').eq('site',CFG.site).order('timestamp',{ascending:false}).limit(500);if(error){$('lastStatus').textContent='Database error';console.error(error);return}const rows=data||[];const today=new Date().toISOString().slice(0,10);$('total').textContent=rows.length;$('human').textContent=rows.filter(x=>x.visitor_type==='human').length;$('bots').textContent=rows.filter(x=>x.visitor_type==='bot').length;$('today').textContent=rows.filter(x=>String(x.timestamp||'').slice(0,10)===today).length;$('visitorRows').innerHTML=rows.length?rows.map(x=>`<tr><td><span class="tag ${x.visitor_type==='bot'?'bot':'human'}">${x.visitor_type||'human'}</span></td><td>${esc(x.city||'—')}</td><td>${esc(x.country||'—')}</td><td>${fmt(x.timestamp)}</td><td>${esc(x.referrer||'Direct')}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No visitor records yet.</div></td></tr>';$('lastStatus').textContent='Updated '+new Date().toLocaleTimeString()}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}catch(e){return v}}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=logout;$('refresh').onclick=loadVisitors;$('reset').onclick=async()=>{if(!confirm('Reset Merlin visitor records?'))return;const {error}=await supabase.from('visitor_logs').delete().eq('site',CFG.site);if(error)alert('Reset failed: '+error.message);else loadVisitors()};init();
</script></body></html>
